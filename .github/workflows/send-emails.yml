name: Send emails for merged PR

on:
  pull_request:
    types:
      - closed
    branches:
      - "test"

jobs:
  send_patches:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 100

      - name: Install deps (git send-email + jq + perl)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo apt-get install -y libauthen-sasl-perl libemail-valid-perl libio-socket-ssl-perl  libmailtools-perl perl libnet-smtp-ssl-perl
          apt-get download git-email
          sudo dpkg -i --force-all git-email*deb

      - name: Configure git identity
        run: |
          git config user.name "gccrs-bot"
          git config user.email "${{ secrets.SMTP_FROM }}"

      - name: Export env
        env:
          GH_EVENT: ${{ toJson(github.event) }}
          #PR_BASE_REF: ${{ github.base.sha }}
        run: |
          echo "$GH_EVENT" > /tmp/gh_event.json
          PR_BASE_REF=$(jq -r '.pull_request.base.sha' /tmp/gh_event.json)
          echo "PR_BASE_REF=$PR_BASE_REF" >> $GITHUB_ENV
          PR_NUMBER=$(jq -r '.pull_request.number' /tmp/gh_event.json)
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          PR_TITLE=$(jq -r '.pull_request.title' /tmp/gh_event.json)
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          PR_URL=$(jq -r '.pull_request.html_url' /tmp/gh_event.json)
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          PR_MERGE_COMMIT=$(jq -r '.pull_request.merge_commit_sha' /tmp/gh_event.json)
          echo "PR_MERGE_COMMIT=$PR_MERGE_COMMIT" >> $GITHUB_ENV
          PR_TARGET_BRANCH=$(jq -r '.pull_request.base.ref' /tmp/gh_event.json)
          echo "PR_TARGET_BRANCH=$PR_TARGET_BRANCH" >> $GITHUB_ENV
          PR_LABELS=$(jq -r '[.pull_request.labels[].name] | join(",")' /tmp/gh_event.json)
          echo "PR_LABELS=$PR_LABELS" >> $GITHUB_ENV
          REPO_SSH=$(jq -r '.repository.ssh_url' /tmp/gh_event.json)
          echo "REPO_SSH=$REPO_SSH" >> $GITHUB_ENV

      - name: Respect opt-outs / guardrails
        run: |
          # Skip if PR has label "no-ml" or "draft"
          if echo "$PR_LABELS" | grep -qiE "(^|,)no-ml(,|$)"; then
            echo "Opt-out label present: skipping mailing list." ; exit 0
          fi
          if jq -e '.pull_request.draft == true' /tmp/gh_event.json >/dev/null; then
            echo "PR is draft: skipping mailing list." ; exit 0
          fi

      - name: Get commit list from PR
        id: commits
        run: |
          # Use the GitHub API via the GITHUB_TOKEN to get the commit SHAs in order
          # set -euo pipefail
          # COMMITS=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          #   -H "Accept: application/vnd.github+json" \
          #   "${{ github.api_url }}/repos/${{ github.repository }}/pulls/$PR_NUMBER/commits" \
          #   | jq -r '.[].sha')
          COMMITS=$(git log --format="%H" "$PR_BASE_REF..HEAD")
          git log --format="%H" "$PR_BASE_REF..HEAD"
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          COUNT=$(echo "$COMMITS" | wc -w | tr -d ' ')
          echo "COUNT=$COUNT" >> $GITHUB_ENV

      - name: Limit very large series
        run: |
          MAX=150
          if [ "${COUNT:-0}" -gt "$MAX" ]; then
            echo "Series has $COUNT commits (> $MAX). Sending cover letter only." >> $GITHUB_STEP_SUMMARY
            echo "ONLY_COVER=1" >> $GITHUB_ENV
          else
            echo "ONLY_COVER=0" >> $GITHUB_ENV
          fi

      - name: Prepare patch series
        run: |
          set -euo pipefail
          rm -rf /tmp/patches && mkdir -p /tmp/patches
          echo "${COMMITS}" | tr ' ' '\n' > /tmp/commits.txt

          if [ "$ONLY_COVER" = "0" ]; then
            # Create a temporary branch that linearizes the PR commits
            git checkout -B ci-mail-patches "$PR_BASE_REF"
            # Cherry-pick commits in the exact PR order (no-commit to batch, then commit)
            while read sha; do
              git cherry-pick --allow-empty -x "$sha"
            done < /tmp/commits.txt

          # Build cover letter text
          N="${COUNT:-0}"
          TITLE="$(printf '[PATCH 0/%d] PR #%s: %s' "$N" "$PR_NUMBER" "$PR_TITLE")"
          #           cat > /tmp/cover.txt <<EOF
          echo "PR: $PR_URL" > /tmp/description.txt
          echo "Merged by: ${{ github.actor }}" >> /tmp/description.txt
          echo "Base: $PR_TARGET_BRANCH" >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo "This series was merged into the gccrs repository and is posted here for" >> /tmp/description.txt
          echo "upstream visibility and potential drive-by review, as requested by GCC" >>  /tmp/description.txt
          echo "release managers." >> /tmp/description.txt
          echo "" >> /tmp/description.txt
          echo " Notes:" >> /tmp/description.txt
          echo " - Source branch: $(jq -r '.pull_request.head.label' /tmp/gh_event.json)" >>  /tmp/description.txt
          echo " - Merge commit: $PR_MERGE_COMMIT" >>  /tmp/description.txt
          echo " - Commit count: $N" >>  /tmp/description.txt
          echo "" >> /tmp/description.txt
          # EOF

            # Generate series + cover letter
            git format-patch \
              --stdout \
              --subject-prefix="gccrs COMMIT" \
              --cover-letter \
              --description-file=/tmp/description.txt \
              --base="$PR_BASE_REF" \
              -n \
              "$PR_BASE_REF"..HEAD > /tmp/series.mbox
          else
            # Cover letter only
            : > /tmp/series.mbox
          fi

          awk -v CONTENT="$PR_TITLE" '{gsub(/\*\*\* SUBJECT HERE \*\*\*/, CONTENT); print}' /tmp/series.mbox > /tmp/final_series.mbox

          # If we produced a full series, prepend the generated cover; else send standalone cover
          # if [ "$ONLY_COVER" = "0" ]; then
          #   # Replace the auto cover letter body with ours but keep threading headers
          #   # Extract first message (=cover) and replace its body
          #   awk '
          #     BEGIN{RS="^From "; ORS="From "; first=1}
          #     NR==1{print $0 > "/tmp/cover_raw.mbox"; next}
          #     {print "From " $0 >> "/tmp/series_without_cover.mbox"}
          #   ' /tmp/series.mbox

          #   # Rebuild cover with our body
          #   {
          #     # Print the first message headers up to the first empty line
          #     awk 'BEGIN{print "From " $0} $0=="" && ++n==1{exit} {print}' /tmp/cover_raw.mbox
          #     echo
          #     cat /tmp/cover.txt
          #   } > /tmp/cover_final.mbox

          #   # Concatenate cover + rest
          #   cat /tmp/cover_final.mbox /tmp/series_without_cover.mbox > /tmp/final_series.mbox
          # else
          #   # Create a single RFC-style email
          #   {
          #     echo "From nobody $(date -R)"
          #     echo "From: ${{ secrets.SMTP_FROM }}"
          #     echo "Subject: $TITLE"
          #     echo
          #     cat /tmp/cover.txt
          #   } > /tmp/final_series.mbox
          # fi

      - name: Send series via git send-email
        env:
          GIT_SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          GIT_SMTP_ENCRYPTION: tls
          GIT_SMTP_SERVER_PORT: ${{ secrets.SMTP_PORT }}
          GIT_SMTP_AUTH: "true"
          GIT_SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          GIT_SMTP_PASSWORD: proutprout
          ##${{ secrets.SMTP_PASSWORD }}
          FROM: gerris@kataplop.net
          #${{ secrets.SMTP_FROM }}
          TO: dkm+gerris@kataplop.net
          # ${{ secrets.PATCH_TO }}
          CC: ${{ secrets.PATCH_CC }}
        run: |
          set -euo pipefail

          git config sendemail.smtpserver "$GIT_SMTP_SERVER"
          git config sendemail.smtpserverport "$GIT_SMTP_SERVER_PORT"
          git config sendemail.smtpencryption "$GIT_SMTP_ENCRYPTION"
          git config sendemail.smtpuser "$GIT_SMTP_USER"
          git config sendemail.smtppass "$GIT_SMTP_PASSWORD"
          git config sendemail.from "$FROM"
          git config sendemail.to "$TO"
          if [ -n "${CC:-}" ]; then git config sendemail.cc "$CC"; fi
          git config sendemail.thread "true"
          git config sendemail.confirm "never"
          git config sendemail.annotate "false"

          git send-email /tmp/final_series.mbox
